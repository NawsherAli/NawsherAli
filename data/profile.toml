value = "700K+"
[[career_facts]]
label = "TENANT LEVELS"
value = "3"
[[career_facts]]
label = "AUTOMATED TESTS"
value = "685"

[telemetry]
# Vanity metrics only appear once they pass these thresholds.
show_stars_min          = 25
show_followers_min      = 50
show_contributions_min  = 100
# Repos never featured or counted in language stats (still counted in "public repos").
exclude_repos = ["shredbottle", "investo", "dezesitemagniemandzien"]
recent_repos_max = 4
stale_after_days = 3        # mark data as stale if the last successful sync is older

