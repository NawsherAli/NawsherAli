<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="tele-dark-title tele-dark-desc"><title id="tele-dark-title">Telemetry</title><desc id="tele-dark-desc">Career facts from the CV, and live GitHub metrics awaiting first sync.</desc><defs><pattern id="tele-dark-grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#16211C" stroke-width="1"/></pattern><pattern id="tele-dark-scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000000" opacity="0.18"/></pattern></defs><style>
text{font-family:'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style><rect x="0.5" y="0.5" width="399" height="339" rx="8" fill="#0F1512" stroke="#22302A"/><rect x="0.5" y="0.5" width="399" height="30" rx="8" fill="#131B17"/><rect x="0.5" y="22" width="399" height="9" rx="0" fill="#131B17"/><line x1="1" y1="30.5" x2="399" y2="30.5" stroke="#22302A"/><rect x="14" y="11" width="8" height="8" rx="0" fill="#E9783A"/><rect x="28" y="11" width="8" height="8" rx="0" fill="#F2A541"/><rect x="42" y="11" width="8" height="8" rx="0" fill="#F2A541"/><text x="64" y="20" font-size="12" fill="#8A988F" font-weight="400" text-anchor="start" letter-spacing="0.5">career.facts  —  source: CV</text><rect x="20" y="50" width="174" height="112" rx="6" fill="#131B17" stroke="#22302A"/><text x="36" y="74" font-size="11" fill="#8A988F" font-weight="400" text-anchor="start" letter-spacing="1.2">EXPERIENCE</text><text x="36" y="112" font-size="30" fill="#F2A541" font-weight="700" text-anchor="start">~5 YRS</text><rect x="206" y="50" width="174" height="112" rx="6" fill="#131B17" stroke="#22302A"/><text x="222" y="74" font-size="11" fill="#8A988F" font-weight="400" text-anchor="start" letter-spacing="1.2">USERS SERVED</text><text x="222" y="112" font-size="30" fill="#F2A541" font-weight="700" text-anchor="start">700K+</text><rect x="20" y="176" width="174" height="112" rx="6" fill="#131B17" stroke="#22302A"/><text x="36" y="200" font-size="11" fill="#8A988F" font-weight="400" text-anchor="start" letter-spacing="1.2">TENANT LEVELS</text><text x="36" y="238" font-size="30" fill="#F2A541" font-weight="700" text-anchor="start">3</text><rect x="206" y="176" width="174" height="112" rx="6" fill="#131B17" stroke="#22302A"/><text x="222" y="200" font-size="11" fill="#8A988F" font-weight="400" text-anchor="start" letter-spacing="1.2">AUTOMATED TESTS</text><text x="222" y="238" font-size="30" fill="#F2A541" font-weight="700" text-anchor="start">685</text><text x="20" y="322" font-size="11" fill="#6A786F" font-weight="400" text-anchor="start">career facts are static and come from the CV</text><rect x="420.5" y="0.5" width="579" height="339" rx="8" fill="#0F1512" stroke="#22302A"/><rect x="420.5" y="0.5" width="579" height="30" rx="8" fill="#131B17"/><rect x="420.5" y="22" width="579" height="9" rx="0" fill="#131B17"/><line x1="421" y1="30.5" x2="999" y2="30.5" stroke="#22302A"/><rect x="434" y="11" width="8" height="8" rx="0" fill="#E9783A"/><rect x="448" y="11" width="8" height="8" rx="0" fill="#F2A541"/><rect x="462" y="11" width="8" height="8" rx="0" fill="#3DDC84"/><text x="484" y="20" font-size="12" fill="#8A988F" font-weight="400" text-anchor="start" letter-spacing="0.5">github.live  —  source: GitHub API</text><text x="444" y="90" font-size="22" fill="#F2A541" font-weight="700" text-anchor="start" letter-spacing="1">AWAITING FIRST SYNC</text><text x="444" y="124" font-size="14" fill="#D5DED8" font-weight="400" text-anchor="start">Live metrics appear after the first run of</text><text x="444" y="146" font-size="14" fill="#3DDC84" font-weight="400" text-anchor="start">.github/workflows/update-profile.yml</text><text x="444" y="180" font-size="13" fill="#8A988F" font-weight="400" text-anchor="start">No numbers are shown until they come from the API.</text><text x="444" y="222" font-size="13" fill="#D5DED8" font-weight="400" text-anchor="start">▸ public repos · account age · last public push</text><text x="444" y="244" font-size="13" fill="#D5DED8" font-weight="400" text-anchor="start">▸ languages and recently updated featured repos</text><text x="444" y="266" font-size="13" fill="#D5DED8" font-weight="400" text-anchor="start">▸ stars, followers and contributions once they pass</text><text x="444" y="288" font-size="13" fill="#6A786F" font-weight="400" text-anchor="start">  the thresholds set in data/profile.toml</text><circle cx="970" cy="90" r="4" fill="#F2A541" class="blink"/></svg>
